<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сиқырлы санау ойыны</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #e0f2f1 0%, #e8f5e9 100%);
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
            height: 92vh;
            min-height: 500px;
            max-height: 680px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            color: #00695c;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .menu-screen, .game-screen, .result-screen {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            overflow: hidden;
        }

        .active {
            display: flex;
        }

        /* Мәзір дизайны */
        .menu-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
            flex-grow: 1;
        }

        .select-box {
            background: #ffffff;
            padding: 15px;
            border-radius: 16px;
            border: 2px solid #e0f2f1;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }

        .select-box:hover {
            border-color: #26a69a;
            transform: translateY(-2px);
        }

        label {
            font-size: 16px;
            font-weight: 700;
            display: block;
            margin-bottom: 8px;
            color: #00796b;
        }

        select {
            width: 100%;
            max-width: 320px;
            padding: 12px;
            font-size: 16px;
            border-radius: 12px;
            border: 2px solid #b2dfdb;
            background-color: #fafafa;
            outline: none;
            cursor: pointer;
            color: #333;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: #00897b;
        }

        .btn {
            background: linear-gradient(135deg, #00897b 0%, #00695c 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,105,92,0.3);
            transition: all 0.2s ease;
            align-self: center;
            margin-top: 10px;
        }

        .btn:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(0,105,92,0.4);
        }

        .btn-orange {
            background: linear-gradient(135deg, #ff7043 0%, #f4511e 100%);
            box-shadow: 0 6px 20px rgba(244,81,30,0.3);
        }

        .btn-orange:hover {
            box-shadow: 0 8px 25px rgba(244,81,30,0.4);
        }

        /* Ойын экраны */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: #f0fdf4;
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            color: #1b5e20;
            border: 1px solid #c8e6c9;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            overflow: hidden;
            height: calc(100% - 130px);
        }

        /* Ойын алаңындағы суреттер жиынтығы */
        .items-box {
            background: #fcfcfc;
            border: 2px solid #e0f2f1;
            border-radius: 18px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-start;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .emoji-card {
            font-size: 32px;
            background: white;
            padding: 4px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border: 1px solid #f0f0f0;
            transition: transform 0.2s;
        }

        .emoji-card:hover {
            transform: scale(1.08);
        }

        /* Санау тапсырмалары бөлімі */
        .tasks-box {
            background: #fffdf2;
            border: 2px solid #fff9c4;
            border-radius: 18px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .task-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid #fff59d;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 28px;
        }

        .task-name {
            font-size: 14px;
            color: #455a64;
            font-weight: 600;
        }

        .task-row input {
            width: 65px;
            padding: 8px;
            font-size: 16px;
            text-align: center;
            border: 2px solid #cfd8dc;
            border-radius: 10px;
            outline: none;
            font-weight: bold;
            color: #37474f;
            transition: border-color 0.2s;
        }

        .task-row input:focus {
            border-color: #ffb300;
            background-color: #fffde7;
        }

        /* Нәтиже экраны */
        .result-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-grow: 1;
        }

        .result-screen h2 {
            color: #2e7d32;
            font-size: 26px;
            font-weight: 800;
        }

        .score-text {
            font-size: 20px;
            line-height: 1.5;
            color: #37474f;
        }

        /* Ішкі айналдыру жолағын (Scrollbar) әдемілеу */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #b2dfdb;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #80cbc4;
        }

        /* Экран бейімделуі (Responsive) */
        @media(min-width: 650px) {
            .game-area {
                flex-direction: row;
            }
            .items-box {
                flex: 1.3;
            }
            .tasks-box {
                flex: 0.9;
            }
            .emoji-card {
                font-size: 36px;
                width: 58px;
                height: 58px;
            }
        }

        @media(max-height: 600px) {
            .container {
                height: 96vh;
                padding: 12px;
            }
            h1 { font-size: 20px; }
            .emoji-card { font-size: 28px; width: 45px; height: 45px; }
            .btn { padding: 10px 30px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1><span>⛄</span> Сиқырлы санау ойыны <span>⛄</span></h1>

        <div id="menuScreen" class="menu-screen active">
            <div class="menu-content">
                <div class="select-box">
                    <label for="topicSelect">Тақырыпты таңдаңыз:</label>
                    <select id="topicSelect">
                        <option value="snowmen">⛄ Қар адамдары</option>
                        <option value="animals">🐱 Жануарлар</option>
                        <option value="fruits">🍎 Жемістер</option>
                    </select>
                </div>

                <div class="select-box">
                    <label for="levelSelect">Қиындық деңгейі:</label>
                    <select id="levelSelect">
                        <option value="easy">Жеңіл (15 зат, 3 түр)</option>
                        <option value="medium">Орташа (25 зат, 4 түр)</option>
                        <option value="hard">Қиын (35 зат, 5 түр)</option>
                    </select>
                </div>
            </div>

            <button class="btn" onclick="startGame()">Ойынды бастау</button>
        </div>

        <div id="gameScreen" class="game-screen">
            <div class="game-header">
                <span id="displayTopic">Тақырып: </span>
                <span id="displayLevel">Деңгей: </span>
            </div>

            <div class="game-area">
                <div id="itemsBox" class="items-box"></div>
                <div id="tasksBox" class="tasks-box"></div>
            </div>

            <button class="btn btn-orange" onclick="checkAnswers()">Тексеру</button>
        </div>

        <div id="resultScreen" class="result-screen">
            <div class="result-content">
                <h2>Керемет! Ойын аяқталды! 🎉</h2>
                <p class="score-text" id="scoreText"></p>
            </div>
            <button class="btn" onclick="goToMenu()">Қайта ойнау</button>
        </div>
    </div>

    <script>
        const emojiData = {
            snowmen: [
                { emoji: '⛄', name: 'Аққала' },
                { emoji: '☃️', name: 'Қар адамы' },
                { emoji: '🤶', name: 'Ақшақар' },
                { emoji: '🎅', name: 'Аяз ата' },
                { emoji: '🎄', name: 'Шырша' }
            ],
            animals: [
                { emoji: '🐱', name: 'Мысық' },
                { emoji: '🐶', name: 'Ит' },
                { emoji: '🐰', name: 'Қоян' },
                { emoji: '🦊', name: 'Түлкі' },
                { emoji: '🐼', name: 'Панда' }
            ],
            fruits: [
                { emoji: '🍎', name: 'Алма' },
                { emoji: '🍌', name: 'Банан' },
                { emoji: '🍇', name: 'Жүзім' },
                { emoji: '🍓', name: 'Құлпынай' },
                { emoji: '🍉', name: 'Қарбыз' }
            ]
        };

        const levelData = {
            easy: { total: 15, types: 3 },
            medium: { total: 25, types: 4 },
            hard: { total: 35, types: 5 }
        };

        let currentCorrectAnswers = {};

        function startGame() {
            const topic = document.getElementById('topicSelect').value;
            const level = document.getElementById('levelSelect').value;

            document.getElementById('displayTopic').innerText = "Тақырып: " + document.getElementById('topicSelect').options[document.getElementById('topicSelect').selectedIndex].text.split(' ')[1];
            document.getElementById('displayLevel').innerText = "Деңгей: " + document.getElementById('levelSelect').options[document.getElementById('levelSelect').selectedIndex].text.split(' ')[0];

            const totalItems = levelData[level].total;
            const typesCount = levelData[level].types;
            const chosenEmojis = emojiData[topic].slice(0, typesCount);

            let gameItems = [];
            currentCorrectAnswers = {};

            chosenEmojis.forEach(item => {
                gameItems.push(item);
                currentCorrectAnswers[item.emoji] = 1;
            });

            for (let i = 0; i < totalItems - typesCount; i++) {
                let randomEmoji = chosenEmojis[Math.floor(Math.random() * chosenEmojis.length)];
                gameItems.push(randomEmoji);
                currentCorrectAnswers[randomEmoji.emoji]++;
            }

            gameItems.sort(() => Math.random() - 0.5);

            const itemsBox = document.getElementById('itemsBox');
            itemsBox.innerHTML = '';
            gameItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'emoji-card';
                div.innerText = item.emoji;
                itemsBox.appendChild(div);
            });

            const tasksBox = document.getElementById('tasksBox');
            tasksBox.innerHTML = '';
            chosenEmojis.forEach(item => {
                const row = document.createElement('div');
                row.className = 'task-row';
                row.innerHTML = `
                    <div class="task-left">
                        <span>${item.emoji}</span>
                        <span class="task-name">${item.name}</span>
                    </div>
                    <input type="number" id="input-${item.emoji}" min="0" placeholder="0">
                `;
                tasksBox.appendChild(row);
            });

            switchScreen('gameScreen');
        }

        function checkAnswers() {
            let correctCount = 0;
            let totalTasks = Object.keys(currentCorrectAnswers).length;

            for (let emoji in currentCorrectAnswers) {
                const inputVal = document.getElementById(`input-${emoji}`).value;
                if (parseInt(inputVal) === currentCorrectAnswers[emoji]) {
                    correctCount++;
                }
            }

            const scoreText = document.getElementById('scoreText');
            if (correctCount === totalTasks) {
                scoreText.innerHTML = `Керемет! Барлығы дұрыс! 🎯<br>Сен <b>${totalTasks}-тен ${correctCount}</b> ұпай жинадың!`;
            } else {
                scoreText.innerHTML = `Жақсы талпыныс!<br>Сен <b>${totalTasks}-тен ${correctCount}</b> ұпай жинадың.<br>Тағы да байқап көр!`;
            }

            switchScreen('resultScreen');
        }

        function goToMenu() {
            switchScreen('menuScreen');
        }

        function switchScreen(screenId) {
            document.getElementById('menuScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.remove('active');

            document.getElementById(screenId).classList.add('active');
        }
    </script>
</body>
</html>
